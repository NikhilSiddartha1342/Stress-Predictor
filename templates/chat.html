<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Stress Advisor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 500px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background: #45a049; }
        .result { background: #e7f3fe; padding: 10px; border-radius: 5px; margin-top: 10px; white-space: pre-line; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Stress Advisor</h2>
        <p>Enter your data to see your stress level and recommendations:</p>
        
        <input type="number" id="academic" placeholder="Academic Performance (%)" />
        <input type="number" id="sleep" placeholder="Sleep Hours" />
        <input type="number" id="app_usage" placeholder="App Usage (hrs/day)" />
        <input type="number" id="attendance" placeholder="Attendance (%)" />
        <input type="number" id="assignments_on_time" placeholder="Assignments on Time (0 or 1)" />
        
        <button onclick="getRecommendation()">Get Recommendation</button>
        
        <div id="result" class="result" style="display:none;"></div>
    </div>

    <script>
        async function getRecommendation() {
            const academic = document.getElementById("academic").value;
            const sleep = document.getElementById("sleep").value;
            const app_usage = document.getElementById("app_usage").value;
            const attendance = document.getElementById("attendance").value;
            const assignments_on_time = document.getElementById("assignments_on_time").value;

            const payload = { academic, sleep, app_usage, attendance, assignments_on_time };

            const resultDiv = document.getElementById("result");
            resultDiv.style.display = "block";
            resultDiv.innerHTML = "Processing...";

            try {
                const response = await fetch("/recommend", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (data.error) {
                    resultDiv.innerHTML = "Error: " + data.error;
                } else {
                    resultDiv.innerHTML = `<strong>Stress Level:</strong> ${data.stressLevel}\n\n
                                           <strong>Recommendation:</strong> ${data.recommendation}`;
                }
            } catch (err) {
                resultDiv.innerHTML = "Error connecting to server.";
            }
        }
    </script>
</body>
</html>
